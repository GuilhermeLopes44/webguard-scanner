[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webguard-scanner"
version = "1.0.0"
description = "Local DAST scanner with CLI and dashboard for authorized security testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WebGuard" }]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "flask>=3.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
webguard = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "db*", "web*"]

[tool.setuptools.package-data]
core = ["../data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
